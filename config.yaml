# Agent Eval default configuration

model:
  # OpenRouter endpoint (OpenAI-compatible)
  api_key: ${OPENROUTER_API_KEY}
  base_url: https://matrixllm.alipay.com/v1/
  model_id: claude-opus-4-6
  context_window: 1000000
  max_tokens: 32768

judge:
  api_key: ${OPENROUTER_API_KEY}
  base_url: ${JUDGE_BASE_URL}
  model_id: ${JUDGE_MODEL}
  enabled: true
  max_tokens: 8192

user_agent_model:
  api_key: ${OPENROUTER_API_KEY}
  base_url: https://matrixllm.alipay.com/v1/
  model_id: claude-opus-4-6
  max_tokens: 65536

defaults:
  trace_dir: traces
  tasks_dir: tasks
  timeout_seconds: 900
