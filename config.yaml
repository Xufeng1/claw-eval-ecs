# Agent Eval default configuration

model:
  # OpenRouter endpoint (OpenAI-compatible)
  api_key: ${OPENROUTER_API_KEY}
  base_url: https://matrixllm.alipay.com/v1/
  model_id: claude-opus-4-6
  context_window: 1000000

judge:
  api_key: ${OPENROUTER_API_KEY}
  base_url: ${JUDGE_BASE_URL}
  model_id: ${JUDGE_MODEL}
  enabled: true

user_agent_model_judge:
  api_key: ${OPENROUTER_API_KEY}
  base_url: ${JUDGE_BASE_URL}
  model_id: ${USER_AGENT_MODEL}
  enabled: true

user_agent_model:
  api_key: ${OPENROUTER_API_KEY}
  base_url: ${JUDGE_BASE_URL}
  model_id: ${USER_AGENT_MODEL}

defaults:
  trace_dir: traces
  tasks_dir: tasks
