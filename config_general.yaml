# Agent Eval default configuration

model:
  # OpenRouter endpoint (OpenAI-compatible)
  api_key: ${OPENROUTER_API_KEY}
  base_url: https://matrixllm.alipay.com/v1/
  model_id: claude-opus-4-6
  context_window: 1000000
  extra_body:
    reasoning:
      effort: high

judge:
  api_key: ${OPENROUTER_API_KEY}
  base_url: https://matrixllm.alipay.com/v1/
  model_id: gemini-3-flash-preview
  enabled: true

defaults:
  trace_dir: traces
  tasks_dir: tasks

